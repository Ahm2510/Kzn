# ================================================================
# Kaizen Production — app.kaizenx.in
# ================================================================

upstream django {
  server service_a:8002;
}

# ------------------------------------------------------------------
# HTTP → HTTPS redirect  +  Let's Encrypt challenge
# ------------------------------------------------------------------
server {
  listen 80;
  server_name app.kaizenx.in;

  # Certbot ACME challenge (must be served over HTTP)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ------------------------------------------------------------------
# HTTPS — main application
# ------------------------------------------------------------------
server {
  listen 443 ssl http2;
  server_name app.kaizenx.in;

  # ---- SSL certificates (Let's Encrypt via certbot) ----
  ssl_certificate     /etc/letsencrypt/live/app.kaizenx.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.kaizenx.in/privkey.pem;

  # ---- SSL hardening ----
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ---- Security headers ----
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # ---- Upload / body limits ----
  client_max_body_size 200M;

  # ---- Proxy timeouts (analysis can take up to 5 minutes) ----
  proxy_read_timeout    300s;
  proxy_connect_timeout 300s;
  proxy_send_timeout    300s;

  # ---- Frontend (React SPA) ----
  root /usr/share/nginx/html;
  index index.html;

  # ---- API → Django (Service A) ----
  location /api/ {
    proxy_pass http://django;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # ---- Django admin static files ----
  location /static/ {
    proxy_pass http://django;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Uploaded files (served by Django FileResponse) ----
  location /uploads/ {
    proxy_pass http://django;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Health check ----
  location /healthz/ {
    proxy_pass http://django;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- React SPA catch-all (client-side routing) ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
