worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  include /etc/nginx/conf.d/*.conf;

  server {
    listen 80;
    server_name app.kaizenx.in;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name app.kaizenx.in;

    ssl_certificate /etc/letsencrypt/live/app.kaizenx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kaizenx.in/privkey.pem;

    location / {
        return 302 https://kaizenx.in;
    }

    location /api/ {
        proxy_pass http://service_a:8002;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
