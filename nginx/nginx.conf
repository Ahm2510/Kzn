worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  # Gzip compression
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   4;
  gzip_min_length   256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  include /etc/nginx/conf.d/*.conf;

  server {
    listen 80;
    server_name app.kaizenx.in;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name app.kaizenx.in;

    ssl_certificate /etc/letsencrypt/live/app.kaizenx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kaizenx.in/privkey.pem;

    location / {
        return 302 https://kaizenx.in;
    }

    location /api/ {
        proxy_pass http://service_a:8002;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
