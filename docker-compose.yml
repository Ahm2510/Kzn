
version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaizen}
      POSTGRES_USER: ${POSTGRES_USER:-kaizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  service_b:
    build:
      context: ./service_b
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_this}
      ALLOW_INTERNAL_PUBLIC: "false"
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"

  service_a:
    build:
      context: ./service_a
    restart: always
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: "super-secret-key-123"
      ALLOWED_HOSTS: "app.kaizenx.in"
      CSRF_TRUSTED_ORIGINS: "https://app.kaizenx.in"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-kaizen}
      DB_USER: ${POSTGRES_USER:-kaizen}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      SERVICE_B_URL: http://service_b:8000
      SERVICE_B_TIMEOUT: ${SERVICE_B_TIMEOUT:-300}
      SERVICE_B_SECRET: ${INTERNAL_SECRET:-change_this}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    expose:
      - "8002"

    networks:
      default:
        aliases:
          - service_a

    depends_on:
      postgres:
        condition: service_healthy
      service_b:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - service_a


volumes:
  postgres_data:

