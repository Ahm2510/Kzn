
version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaizen}
      POSTGRES_USER: ${POSTGRES_USER:-kaizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  service_b:
    build:
      context: ./service_b
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_this}
      ALLOW_INTERNAL_PUBLIC: "false"
      RATE_LIMIT_ENABLED: "true"
      CORS_ORIGINS: "http://service_a:8002"

    ports:
      - "8000:8000"
  service_a:
    build:
      context: ./service_a
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 300"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-app.kaizenx.in,localhost,127.0.0.1}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-kaizen}
      DB_USER: ${POSTGRES_USER:-kaizen}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      SERVICE_B_URL: http://service_b:8000
      SERVICE_B_TIMEOUT: ${SERVICE_B_TIMEOUT:-300}
      SERVICE_B_SECRET: ${INTERNAL_SECRET:-change_this}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.kaizenx.in}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://app.kaizenx.in}
    expose:
      - "8002"
    volumes:
      - upload_data:/app/uploads

    networks:
      default:
        aliases:
          - service_a

    depends_on:
      postgres:
        condition: service_healthy
      service_b:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - service_a


volumes:
  postgres_data:
  upload_data:

